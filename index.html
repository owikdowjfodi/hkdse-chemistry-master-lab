<!doctype html>
<html lang="zh-HK">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103b38"><meta name="description" content="HKDSE Chemistry 3D virtual laboratory"><title>ChemLab Studio · HKDSE 化學實驗室</title><link rel="icon" href="./asset-g0ntCpR4.svg"><link rel="manifest" href="./asset-B4UZ--Dy.webmanifest">  <script type="module" crossorigin src="./studio-Bk-2NFjA.js"></script>
  <link rel="stylesheet" crossorigin href="./asset-C9sro8CN.css">
</head>
<body><a class="skip" href="#workspace">跳至實驗枱</a>
<header class="mast"><a class="brand" href="./" aria-label="ChemLab Studio"><img src="./asset-g0ntCpR4.svg" alt=""><span>ChemLab <b>Studio</b></span></a><span class="course">HKDSE CHEMISTRY</span><nav id="topnav"></nav><div class="tools"><button id="lang"></button><button id="settings" class="square" aria-label="Settings"></button></div></header>
<main id="workspace"><div class="heading"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="subtitle"></p></div><div class="headbuttons"><button id="mode"></button><button class="primary" id="save"></button></div></div>
<div class="workgrid">
<section class="bench card"><div class="panelheading"><div class="sectitle" id="benchtitle"></div><span class="pill"><i></i> <span id="renderstatus">3D</span></span></div>
<div class="viewport" id="viewport"><canvas id="scene" tabindex="0" aria-label="3D interactive chemistry bench"></canvas><div id="viewlabel" class="viewlabel"></div><div class="camerabar" id="cameras"></div></div>
<div class="benchfoot"><span id="gesture"></span><button class="textbtn" id="objects"></button></div></section>
<section class="readings card"><div class="panelheading"><div class="sectitle" id="meterheading"></div><button id="record" class="textbtn"></button></div><div id="meters"></div><div class="chartwrap"><div id="chartTitle"></div><canvas id="chart" aria-label="Measurement plot" role="img"></canvas></div><div id="observation"></div></section>
<section class="operation card"><div class="panelheading"><div class="sectitle" id="operationheading"></div><button class="textbtn" id="params"></button></div><div id="actions"></div><div id="message" aria-live="polite"></div></section>
<section class="notebook card"><div class="panelheading"><div class="sectitle" id="noteheading"></div><button class="textbtn" id="openbook"></button></div><div id="note"></div></section>
</div><footer><span>ChemLab Studio · HKDSE Chemistry</span><span id="network"></span></footer></main>
<dialog id="dialog"><div class="dhead"><h2 id="dtitle"></h2><button id="close" class="square" aria-label="Close">×</button></div><div id="body"></div></dialog><div id="toast" role="status"></div>
<input hidden id="importfile" type="file" accept="application/json,.json"></body></html>
